function generateProspects(s){const type=choose(s,['Deep receivers','Elite defense','Strong quarterbacks','Weak quarterbacks','Top-heavy','Balanced','Deep class']);s.draftClass=type;s.prospects=[];for(let i=0;i<300;i++){const pos=choose(s,['QB','QB','RB','WR','WR','TE','LT','LG','C','RG','RT','EDGE','EDGE','DT','LB','CB','CB','S','K','P','FB']),p=player(s,pos,null,true);const originalOverall=p.ovr;if(type==='Strong quarterbacks'&&pos==='QB'||type==='Deep receivers'&&pos==='WR'||type==='Elite defense'&&['EDGE','DT','LB','CB','S'].includes(pos)){p.ovr=CLAMP(p.ovr+7);p.potential=CLAMP(p.potential+5);}if(type==='Weak quarterbacks'&&pos==='QB')p.ovr-=8;if(type==='Deep class')p.ovr+=3;if(random(s)<.007){p.ovr=int(s,77,86);p.potential=int(s,94,99);}for(const k of ATTRS)p.attrs[k]=CLAMP(p.attrs[k]+p.ovr-originalOverall,25,99);p.scouted=0;p.scoutGrade=CLAMP(p.ovr+int(s,-16,16));p.projectedRound=CLAMP(Math.ceil((87-p.scoutGrade)/5),1,7);p.combine={forty:round(5.55-p.attrs.speed*.012+random(s)*.15),bench:int(s,8,35),vertical:int(s,25,42)};p.collegeProduction=pos==='QB'?`${int(s,1800,4200)} passing yards, ${int(s,12,38)} TD`:['RB','WR','TE'].includes(pos)?`${int(s,450,1700)} scrimmage yards, ${int(s,4,18)} TD`:`${int(s,25,95)} tackles, ${int(s,0,12)} sacks`;p.strengths=[...ATTRS].sort((a,b)=>p.attrs[b]-p.attrs[a]).slice(0,2);p.weaknesses=[...ATTRS].sort((a,b)=>p.attrs[a]-p.attrs[b]).slice(0,2);p.schemeFit=choose(s,['West Coast','Spread','Vertical','Power Run','Zone Run','Play Action']);s.prospects.push(p);}s.prospects.sort((a,b)=>b.scoutGrade-a.scoutGrade);s.prospects.forEach((p,i)=>{p.rank=i+1;p.positionRank=s.prospects.slice(0,i+1).filter(x=>x.pos===p.pos).length;});}

`;

const TABS = [['coach', 'COACH'], ['run', 'RUN'], ['quick', 'QUICK'], ['deep', 'DEEP'], ['action', 'TRICK'], ['kick', 'SPECIAL']];
const KEYS = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', ' ', 'shift', 'j', 'q', 'x', 'e', 'tab', 'f', 't', 'p', 'escape', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function startGame(container, options) {
  const { home, away, onFinish, onExit, onSettings } = options;
  const match = F.createMatch({ ...options, coach: !!options.settings?.coach, simDefense: !!options.settings?.simDefense });
  let quickThrow = !!options.settings?.quickThrow, cursor = null, spotThrow = null;
  const userSide = match.user, me = match.sides[userSide], them = match.sides[1 - userSide];
  let muted = !!options.muted, audio = null, crowd = null, dead = false, frame = 0, last = 0, paused = false;
  let tab = 'coach', flip = 1, resultTimer = 0, holdTimer = 0, banner = { title: '', sub: '' }, shownPhase = '', shownKey = '';
  let cardActions = [], notices = [];
  let meter = null, audible = false, aimLabel = 0, fx = null, pendingThrow = null, summary = null, shake = 0, particles = [], floats = [];
  let stickX = 0, stickY = 0, stickPointer = null, aPointer = null;
  let edge = { juke: false, away: false, switch: false };
  const keys = new Set();

  const root = document.createElement('div');
  root.className = 'football-game';
  root.innerHTML = `<style>${CSS}</style>
<div class="fb-top">
  <div class="fb-team"><i data-color="home"></i><div><small data-team="home"></small><span class="fb-score" data-score="home">0</span></div></div>
  <div class="fb-mid"><small data-clock></small><b data-down></b></div>
  <div class="fb-team"><div style="text-align:right"><small data-team="away"></small><span class="fb-score" data-score="away">0</span></div><i data-color="away"></i></div>
  <button class="fb-icon" data-pause aria-label="Pause game">II</button>
  <button class="fb-icon" data-mute aria-label="Toggle sound"></button>
</div>
<div class="fb-field">
  <canvas class="fb-canvas" width="600" height="800" aria-label="Football field"></canvas>
  <div class="fb-banner"><strong data-message></strong><small data-sub></small></div>
  <div class="fb-stamina" hidden><i data-stamina></i></div>
  ${[1, 2, 3, 4, 5].map(n => `<button class="fb-throw" data-throw="${n}" aria-label="Pass to receiver ${n}" hidden>${n}</button>`).join('')}
  <div class="fb-controls" hidden>
    <div class="fb-joystick" role="application" aria-label="Drag to move"><div class="fb-stick"></div></div>
    <button class="fb-b" data-b></button><button class="fb-a" data-a></button>
  </div>
  <div class="fb-meter" hidden><small data-meter-label></small><div><u data-meter-zone></u><i data-meter-mark></i></div><small>Press SPACE or tap to kick</small></div>
  <div class="fb-bar" hidden></div>
  <div class="fb-panel" hidden></div>
  <div class="fb-overlay" hidden></div>
</div>`;
  container.append(root);
  const $ = s => root.querySelector(s);
  const canvas = $('.fb-canvas'), ctx = canvas.getContext('2d'), overlay = $('.fb-overlay'), panel = $('.fb-panel'), bar = $('.fb-bar'), controls = $('.fb-controls');
  const joystick = $('.fb-joystick'), stick = $('.fb-stick'), btnA = $('[data-a]'), btnB = $('[data-b]'), meterBox = $('.fb-meter');
  const throwButtons = [1, 2, 3, 4, 5].map(n => { const b = $(`[data-throw="${n}"]`); b.dataset.throw = String(n); return b; });
  $('[data-team="home"]').textContent = home.abbr; $('[data-team="away"]').textContent = away.abbr;
  $('[data-color="home"]').style.background = home.color || '#3c8cca'; $('[data-color="away"]').style.background = away.color || '#c75248';
  const make = (tag, className, text) => { const e = document.createElement(tag); if (className) e.className = className; if (text !== undefined) e.textContent = text; return e; };
  const button = (text, fn, className) => { const b = make('button', className, text); b.onclick = () => { blip(330, 0.04); fn(); }; return b; };

  /* ---------- audio ---------- */
  function ac() {
    if (muted) return null;
    try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); return audio; } catch { return null; }
  }
  function blip(freq = 440, length = 0.1, type = 'square', gain = 0.035, slide = 0) {
    const a = ac(); if (!a) return;

      const o = a.createOscillator(), g = a.createGain();

  }
  function noise(length = 0.2, gain = 0.05, freq = 900, q = 0.8) {
    const a = ac(); if (!a) return;
    try {
      const buffer = a.createBuffer(1, Math.floor(a.sampleRate * length), a.sampleRate), data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buffer; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(gain, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + length);
      src.connect(f); f.connect(g); g.connect(a.destination); src.start();
    } catch { /* audio is optional */ }
  }
  function startCrowd() {
    const a = ac(); if (!a || crowd) return;
    try {
      const buffer = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buffer; src.loop = true; f.type = 'bandpass'; f.frequency.value = 520; f.Q.value = 0.5; g.gain.value = 0.012;
      src.connect(f); f.connect(g); g.connect(a.destination); src.start();
      crowd = { src, gain: g };
    } catch { /* audio is optional */ }
  }
  function cheer(level) {
    if (!crowd || !audio) return;
    try { const g = crowd.gain.gain, t = audio.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(0.012 + level * 0.06, t); g.linearRampToValueAtTime(0.012, t + 1.5 + level * 2); } catch { /* audio is optional */ }
  }
  const whistle = () => { blip(2100, 0.22, 'sine', 0.03, 120); blip(2300, 0.22, 'sine', 0.02, -80); };

  function sounds() {
    // The engine reports what happened; this turns it into sound and screen feedback.
    for (const e of match.events) {
      const mine = match.off === userSide;
      if (e.type === 'snap') { blip(160, 0.05); startCrowd(); }
      else if (e.type === 'throw') noise(0.16, 0.035, e.lob ? 700 : 1400, 1.2);
      else if (e.type === 'catch') { blip(660, 0.07, 'triangle', 0.05); fx = { result: 'catch', by: e.receiver, why: e.why, t: 0 }; }
      else if (e.type === 'craft') { floats.push({ text: e.text, x: e.receiver.x, y: e.receiver.y, t: -0.6 }); blip(880, 0.05, 'triangle', 0.025); }
      else if (e.type === 'pass') passFx(e);
      else if (e.type === 'tackle') { noise(0.18, 0.09, 180, 0.7); blip(90, 0.12, 'sine', 0.08, -40); shake = e.big ? 9 : 4; }
      else if (e.type === 'broken') { noise(0.1, 0.06, 300); float('BROKEN TACKLE'); }
      else if (e.type === 'juke') blip(520, 0.05, 'triangle', 0.03, 200);
      else if (e.type === 'pressure' && mine && match.carrier === match.qb) float('PRESSURE');
      else if (e.type === 'first') { blip(520, 0.08, 'triangle', 0.04); blip(780, 0.12, 'triangle', 0.04); cheer(mine ? 0.3 : 0.05); }
      else if (e.type === 'touchdown' || e.type === 'score') { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => !dead && blip(f, 0.18, 'square', 0.04), i * 110)); cheer(mine ? 1 : 0.15); if (e.type === 'touchdown') confetti(mine); }
      else if (e.type === 'turnover' || e.type === 'interception') { blip(180, 0.3, 'sawtooth', 0.04, -80); cheer(mine ? 0.1 : 0.8); shake = 6; }
      else if (e.type === 'sack') cheer(mine ? 0.05 : 0.6);
      else if (e.type === 'timeout') whistle();
      else if (e.type === 'quarter') { whistle(); notice(`END OF Q${match.quarter - 1} · ${scoreLine()}`, [`${match.sides[match.off].team.abbr} ball`]); }
      else if (e.type === 'half') { whistle(); notice(`HALFTIME · ${scoreLine()}`, [teamLine(me), teamLine(them), `${match.sides[match.off].team.abbr} receives the second-half kickoff`]); }
      else if (e.type === 'overtime') { whistle(); notice(`OVERTIME · ${scoreLine()}`, ['Sudden death: the first score wins.', `${match.sides[match.off].team.abbr} won the toss`]); }
      else if (e.type === 'final') whistle();
    }
    match.events.length = 0;
  }
  /** Start the short replay-style animation that shows how a pass ended. */
  function passFx(e) {
    const away = e.by ? Math.sign(e.y - e.by.y) || 1 : 0, kind = e.result;
    const loose = { tip: [e.vx * 0.22, e.vy * 0.22 + away * 2.5, 5.5], breakup: [e.vx * 0.1, away * 3.5, 3.2], drop: [e.vx * 0.15, e.vy * 0.15, 2.4], miss: [e.vx * 0.55, e.vy * 0.55, 0] }[kind];
    fx = { result: kind, by: e.by, why: e.why, receiver: e.receiver, t: 0, x0: e.x, y0: e.y, x: e.x, y: e.y, h: Math.max(0.3, e.h), vx: loose?.[0] || 0, vy: loose?.[1] || 0, vh: loose?.[2] || 0, loose: !!loose };

    else if (kind === 'breakup') { noise(0.12, 0.08, 400); shake = 3; }

  }
  function stepFx(dt) {
    if (!fx) return;

    if (!fx.loose) return;

    fx.x += fx.vx * dt; fx.y += fx.vy * dt; fx.vh -= 20 * dt; fx.h += fx.vh * dt;
    if (fx.h <= 0) { fx.h = 0; fx.vh = Math.abs(fx.vh) * 0.42; fx.vx *= 0.55; fx.vy *= 0.55; if (fx.vh < 0.8) fx.vh = 0; }
  }
  // Every label says why it happened, in terms of who had position on the ball.
  const FX_LABEL = { tip: 'STEPPED IN FRONT · TIPPED', 'tip-int': 'TIPPED AND PICKED OFF', int: 'INTERCEPTED', breakup: 'BROKEN UP', drop: 'DROPPED',
    'int:undercut': 'BEAT HIM TO THE BALL · INTERCEPTED', 'int:overthrown': 'OVERTHROWN · PICKED OFF', 'int:contested': 'WON THE FIGHT · INTERCEPTED',
    'breakup:undercut': 'IN FRONT OF THE RECEIVER · BROKEN UP', 'breakup:contested': 'CONTESTED · BROKEN UP', 'breakup:jarred': 'HIT AS HE CAUGHT IT',
    'catch:contested': 'CONTESTED CATCH', 'catch:shielded': 'DEFENDER BEHIND HIM · CAUGHT', 'catch:stolen': 'TOOK IT AWAY FROM THE DEFENDER' };
  const fxLabel = f => FX_LABEL[`${f.result}:${f.why}`] || FX_LABEL[f.result];

  const scoreLine = () => `${me.team.abbr} ${me.score} — ${them.team.abbr} ${them.score}`;
  function teamLine(side) { const t = side.totals; return `${side.team.abbr}: ${t.passYards + t.rushYards} yards (${t.passYards} pass, ${t.rushYards} rush), ${t.firstDowns} first downs, ${t.turnovers} turnovers`; }
  function notice(title, lines) { notices.push({ title, lines, t: 0 }); }

  function float(text) { const c = match.carrier || match.qb; if (c) floats.push({ text, x: c.x, y: c.y, t: 0 }); }
  function confetti(mine) {
    const colors = mine ? [me.team.color, me.team.secondary, '#ffd166'] : [them.team.color, '#ffffff'];
    for (let i = 0; i < 70; i++) particles.push({ x: Math.random(), y: -0.1 - Math.random() * 0.3, vx: (Math.random() - 0.5) * 0.2, vy: 0.25 + Math.random() * 0.4, c: colors[i % colors.length] || '#fff', t: 0 });
  }

  /* ---------- flow ---------- */
  const userOffense = () => match.off === userSide;
  const say = (title, sub = '') => { banner = { title, sub }; };
  const ordinal = ['', '1st', '2nd', '3rd', '4th'];
  function downText() {
    if (match.conv) return 'Two-point try';
    const toGo = match.firstAt >= 100 ? 'Goal' : Math.max(1, Math.round(match.firstAt - match.los));
    const spot = Math.round(match.los), where = spot === 50 ? '50' : spot < 50 ? `own ${spot}` : `opp ${100 - spot}`;
    return `${ordinal[Math.min(4, match.down)]} & ${toGo} · ${where}`;
  }
  const clockText = () => `${match.quarter > 4 ? 'OT' : `Q${match.quarter}`} ${Math.floor(Math.max(0, match.clock) / 60)}:${String(Math.floor(Math.max(0, match.clock) % 60)).padStart(2, '0')}`;

  function playCard(play) {
    const scheme = me.team.scheme?.offense, b = make('button', 'fb-card');
    const art = document.createElement('canvas'); art.width = 116; art.height = 100;
    drawArt(art.getContext('2d'), F.playArt(play.id, flip), 116, 100);
    const text = make('div');
    text.append(title(play.name), make('small', '', play.note));
    if (play.fits?.includes(scheme)) text.append(make('em', '', 'SCHEME FIT'));
    b.append(art, text);
    return act(b, () => { if (match.choosePlay(play.id, flip)) { audible = false; blip(330, 0.04); refresh(true); } });
  }
  function defenseCard(call) {
    const b = make('button', 'fb-card'), art = document.createElement('canvas'); art.width = 116; art.height = 100;
    drawDefenseArt(art.getContext('2d'), call, 116, 100);
    const text = make('div'); text.append(title(call.name), make('small', '', call.note));
    b.append(art, text);
    return act(b, () => { if (match.chooseDefense(call.id)) { blip(330, 0.04); refresh(true); } });
  }
  // Cards are numbered so the whole play call can be made from the keyboard.
  function title(name) { const b = make('b'); b.append(make('kbd', '', String(cardActions.length + 1)), name); return b; }
  function act(b, fn) { b.onclick = fn; cardActions.push(fn); return b; }
  function textCard(name, note, fn) { const b = make('button', 'fb-card'), text = make('div'); text.append(title(name), make('small', '', note)); b.append(text); return act(b, fn); }
  function timeoutButton() {
    const b = button(match.pendingRunoff > 0 ? `Timeout (${me.timeouts}) · saves ${match.pendingRunoff}s` : `Timeouts: ${me.timeouts}`, () => { if (match.timeout()) refresh(true); });
    b.disabled = !(match.pendingRunoff > 0 && me.timeouts > 0);
    return b;
  }

  function buildPanel() {
    panel.replaceChildren(); cardActions = [];
    const head = make('header');
    if (match.phase === 'pat') {
      head.append(make('b', '', 'TOUCHDOWN'), make('span', '', 'Choose the try'));
      const cards = make('div', 'fb-cards');
      cards.append(textCard('Kick the extra point', 'One point, almost automatic.', () => { match.pat('kick'); refresh(true); }), textCard('Go for two', 'One play from the 2-yard line.', () => { match.pat('two'); refresh(true); }));
      panel.append(head, cards);
      return;
    }
    if (userOffense()) {
      head.append(make('b', '', `YOUR BALL · ${downText()}`), make('span', '', `${FORMATION_HINT[tab] || ''}`));
      const tabs = make('div', 'fb-tabs');
      for (const [id, label] of TABS) { if (id === 'kick' && match.conv) continue; const b = button(label, () => { tab = id; buildPanel(); }, id === tab ? 'active' : ''); tabs.append(b); }
      const cards = make('div', 'fb-cards');
      if (tab === 'kick') {
        const yards = Math.round(100 - match.los + 17);
        cards.append(
          textCard(`Field goal · ${yards} yards`, `${Math.round(match.fieldGoalChance() * 100)}% kicker range. Time the meter.`, () => startKick()),
          textCard('Punt', 'Flip the field and play defense.', () => { audible = false; match.punt(); refresh(true); }),
          textCard('Kneel', 'Lose a yard, keep the clock running.', () => { audible = false; match.clockPlay('kneel'); refresh(true); }),
          textCard('Spike', 'Stop the clock. Costs the down.', () => { audible = false; match.clockPlay('spike'); refresh(true); }));
      } else {
        const ids = tab === 'coach' ? match.suggest() : F.PLAYBOOK.filter(p => p.cat === tab).map(p => p.id);
        for (const id of ids) cards.append(playCard(F.PLAYBOOK.find(p => p.id === id)));
      }
      const row = make('div', 'fb-row');
      row.append(button(flip > 0 ? 'Strength: right' : 'Strength: left', () => { flip = -flip; buildPanel(); }), timeoutButton(), button('How to play', pause));
      panel.append(head, tabs, cards, row);
    } else {
      head.append(make('b', '', `DEFENSE · ${them.team.abbr} ${downText()}`), make('span', '', 'Call your coverage'));
      const cards = make('div', 'fb-cards');
      for (const call of F.DEFENSE_CALLS) cards.append(defenseCard(call));
      const row = make('div', 'fb-row');

  const FORMATION_HINT = { coach: 'Coordinator picks for this down', run: 'Follow the arrow, read the blocks', quick: 'Get it out fast', deep: 'Needs time in the pocket', action: 'Fakes and screens', kick: 'Kicks and clock plays' };
  function cycleTab(step) { const ids = TABS.map(t => t[0]).filter(id => !(id === 'kick' && match.conv)); tab = ids[(ids.indexOf(tab) + step + ids.length) % ids.length]; blip(300, 0.03); buildPanel(); }

  function buildBar() {
    bar.replaceChildren();

  function snap() { if (match.phase === 'presnap' && userOffense() && !paused && !audible) { clearInput(); match.snap(); refresh(true); } }

  /** Bring the DOM in line with the match phase. Rebuilds only when the phase or situation changes. */

      if (phase === 'playcall') say(userOffense() ? 'CALL A PLAY' : `${them.team.abbr} BALL`, userOffense() ? `${fresh}Keys: 1-9 pick a play, arrows change tab.` : `${fresh}Pick a defense, or sim the drive.`);
      else if (phase === 'presnap') say(userOffense() ? 'READ THE DEFENSE' : 'DEFENSE', readLook());

  /** A coordinator's one-line read of what the other side is showing. Hidden on Expert. */
  function readLook() {
    const los = match.los, by = match.ballY, expert = String(options.difficulty || '').toLowerCase() === 'expert';
    if (!userOffense()) {
      const backs = match.ents.filter(e => !e.team && e.back).length, wide = match.ents.filter(e => !e.team && e.pos === 'WR').length;
      return `${them.team.abbr} in ${F.FORMATIONS[match.play.form].name}: ${backs > 1 ? 'two backs, watch the run' : wide >= 3 ? `${wide} wide, expect a pass` : 'balanced look'}. Move your man, Space sprints, E switches.`;

  function headline(l) {
    if (l.kind === 'td') return 'TOUCHDOWN';
    if (l.kind === 'int') return 'INTERCEPTED';
    if (l.kind === 'fumble') return 'FUMBLE';
    if (l.kind === 'sack') return 'SACK';
    if (l.kind === 'incomplete') return 'INCOMPLETE';
    if (l.kind === 'special') return l.score ? 'IT IS GOOD' : 'SPECIAL TEAMS';

  }

  const statText = l => [l.passAttempts ? `${l.completions}/${l.passAttempts}, ${l.passYards} yds, ${l.passTD} TD, ${l.interceptions} INT` : '', l.rushAttempts ? `${l.rushAttempts} car, ${l.rushYards} yds${l.rushTD ? `, ${l.rushTD} TD` : ''}` : '', l.catches ? `${l.catches} rec, ${l.recYards} yds${l.recTD ? `, ${l.recTD} TD` : ''}` : '', l.tackles ? `${l.tackles} tkl${l.sacks ? `, ${l.sacks} sack` : ''}${l.defInt ? `, ${l.defInt} INT` : ''}${l.forcedFumbles ? `, ${l.forcedFumbles} FF` : ''}` : ''].filter(Boolean).join(' · ');
  const impact = l => l.passYards * 0.04 + l.passTD * 4 - l.interceptions * 2 + l.rushYards * 0.1 + l.rushTD * 6 + l.recYards * 0.1 + l.recTD * 6 + l.tackles * 0.5 + l.sacks * 3 + l.defInt * 5 + l.forcedFumbles * 3;
  /** Team totals, the leading players for both teams and the drive log, built from the live match. */
  function boxScore() {
    const wrap = make('div'), table = make('table');
    const rowOf = (label, a, b) => { const tr = make('tr'); tr.append(make('td', '', label), make('td', '', String(a)), make('td', '', String(b))); return tr; };
    const a = me.totals, b = them.totals;
    table.append(rowOf('', me.team.abbr, them.team.abbr), rowOf('Total yards', a.passYards + a.rushYards, b.passYards + b.rushYards), rowOf('Passing', a.passYards, b.passYards), rowOf('Rushing', a.rushYards, b.rushYards), rowOf('First downs', a.firstDowns, b.firstDowns), rowOf('Turnovers', a.turnovers, b.turnovers), rowOf('Sacks allowed', a.sacksAllowed, b.sacksAllowed));
    const lines = make('div', 'fb-lines');
    for (const side of [me, them]) {
      const col = make('div'); col.append(make('b', '', side.team.abbr));
      const top = [...side.lines.values()].sort((x, y) => impact(y) - impact(x)).slice(0, 6);
      for (const l of top) col.append(make('div', '', `${l.pos} ${l.name}: ${statText(l)}`));
      if (!top.length) col.append(make('div', '', 'No stats yet'));

  }

  function finalScreen() {
    const r = match.result(), mine = me.score, theirs = them.score;
    overlay.hidden = false; overlay.replaceChildren();
    const star = [...me.lines.values(), ...them.lines.values()].sort((x, y) => impact(y) - impact(x))[0];
    const done = make('button', '', 'Return to franchise');
    done.onclick = () => { destroy(); onFinish?.(r); };
    overlay.append(make('h2', '', mine > theirs ? 'VICTORY' : mine < theirs ? 'DEFEAT' : 'FINAL'), make('p', '', scoreLine()));
    if (star) overlay.append(make('p', '', `Player of the game: ${star.pos} ${star.name} · ${statText(star)}`));
    overlay.append(boxScore(), done);

  }

  function setting(key, value) { if (key === 'quickThrow') quickThrow = value; else match[key] = value; onSettings?.({ coach: match.coach, simDefense: match.simDefense, quickThrow }); }
  function pause() {
    if (match.phase === 'final') return;
    paused = !paused; clearInput();
    overlay.hidden = !paused;
    if (!paused) return;
    overlay.replaceChildren();
    const resume = make('button', '', 'Resume game'); resume.dataset.resume = '1'; resume.onclick = pause;
    const coach = make('button', 'alt', `Coach mode: ${match.coach ? 'ON · AI runs your plays' : 'OFF · you control the ball'}`);
    coach.onclick = () => { setting('coach', !match.coach); paused = false; pause(); };
    const sim = make('button', 'alt', `Defense: ${match.simDefense ? 'auto-sim every drive' : 'you call and play it'}`);
    sim.onclick = () => { setting('simDefense', !match.simDefense); paused = false; pause(); };
    const numbers = make('button', 'alt', `Number keys: ${quickThrow ? 'throw at once' : 'aim first, press again to throw'}`);
    numbers.onclick = () => { setting('quickThrow', !quickThrow); paused = false; pause(); };
    const exit = make('button', 'alt', 'Exit without saving game'); exit.dataset.exit = '1'; exit.onclick = () => { destroy(); onExit?.(); };
    const stats = make('button', 'alt', 'Box score and drives');
    stats.onclick = () => { overlay.replaceChildren(make('h2', '', scoreLine()), boxScore(), button('Back', () => { paused = false; pause(); })); };
    const help = make('div', 'fb-lines');
    const tips = [['CALLING PLAYS', ['1-9 picks a card, arrows change tab', 'F flips the play, T calls timeout', 'Audible once per down at the line', 'SPECIAL tab: kicks, kneel, spike']], ['OFFENSE', ['Space snaps, hold it to sprint (anyone)', 'Number aims a pass, same number throws', 'Or click any spot: tap bullet, hold lob', 'Runners keep going until you steer', 'Shift jukes, Q throws it away', '★ marks an elite route runner']], ['DEFENSE', ['Pick a coverage or sim the drive (0)', 'Stick or WASD steers your man', 'Let go and he plays his assignment', 'Hold Space to sprint', 'E switches to the nearest defender']], ['READING IT', ['Defender in front of your man: do not throw', 'Defender behind him: he can only tackle', 'Lobs can be played from behind', 'Repeat a play and the defense jumps it', 'A red ! is a free rusher: get rid of it']]];
    for (const [head, items] of tips) { const col = make('div'); col.append(make('b', '', head)); for (const item of items) col.append(make('div', '', item)); help.append(col); }
    overlay.append(make('h2', '', 'TIMEOUT'), resume, stats, numbers, coach, sim, exit, help);
    // Tests and assistive tech look these up by attribute.
    $('[data-resume]').onclick = resume.onclick; $('[data-exit]').onclick = exit.onclick;
  }

  /* ---------- per-frame update ---------- */
  function readInput() {
    const up = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - stickY;
    const right = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0) + stickX;
    const d = viewDir();
    const input = { x: up * d, y: right * d, sprint: keys.has(' ') || aPointer !== null, juke: edge.juke, throwAway: edge.away, switch: edge.switch };
    if (pendingThrow) {
      pendingThrow.held += lastDt;
      if (pendingThrow.released || pendingThrow.held > 0.45) { input.throwTo = pendingThrow.label; input.lob = pendingThrow.held > 0.2; pendingThrow = null; }
    }
    if (spotThrow) {
      spotThrow.held += lastDt;
      if (spotThrow.released || spotThrow.held > 0.45) { input.throwAt = fieldAt(cursor.sx, cursor.sy); input.lob = spotThrow.held > 0.2; spotThrow = null; }
    }
    edge = { juke: false, away: false, switch: false };

  }
  let lastDt = 0.016;
  function update(dt) {
    lastDt = dt;
    if (paused) return;
    for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.t < 3);
    for (const f of floats) f.t += dt;
    floats = floats.filter(f => f.t < 1);
    shake = Math.max(0, shake - dt * 30);
    stepFx(dt);
    if (match.phase !== 'live' || match.ball.thrown) aimLabel = 0;
    sounds();
    if (!summary && notices.length) { summary = notices.shift(); refresh(true); }
    if (summary) { summary.t += dt; if (summary.t > 3.2) { summary = null; refresh(true); } return; }
    if (meter) { meter.pos += meter.dir * meter.speed * dt; if (meter.pos > 1) { meter.pos = 1; meter.dir = -1; } if (meter.pos < -1) { meter.pos = -1; meter.dir = 1; } return; }

    if (phase === 'presnap' && userOffense() && match.coach) { holdTimer += dt; if (holdTimer > 1.2) { holdTimer = 0; match.snap(); } }

    else if (phase === 'dead') { resultTimer -= dt; holdTimer -= dt; if (resultTimer <= 0) match.advance(); }
    refresh(false);
  }

  /* ---------- rendering ---------- */
  let viewW = 600, viewH = 800, scale = 10, camX = 30, camY = F.FIELD_W / 2;
  const viewDir = () => (userSide < 0 || userOffense() ? 1 : -1);
  const fieldAt = (sx, sy) => ({ x: camX - (sy - viewH * 0.5) / (scale * viewDir()), y: camY + (sx - viewW / 2) / (scale * viewDir()) });
  const passing = () => match.phase === 'live' && userOffense() && !match.coach && match.carrier === match.qb && !match.ball.thrown;
  const px = (x, y) => [viewW / 2 + (y - camY) * scale * viewDir(), viewH * 0.5 - (x - camX) * scale * viewDir()];
  function text(t, x, y, size = 12, color = '#fff', align = 'center') { ctx.fillStyle = color; ctx.font = `800 ${size}px ui-monospace,Menlo,monospace`; ctx.textAlign = align; ctx.fillText(t, x, y); }
  const rect = (x0, y0, x1, y1, color) => { const [a, b] = px(x0, y0), [c, d] = px(x1, y1); ctx.fillStyle = color; ctx.fillRect(Math.min(a, c), Math.min(b, d), Math.abs(c - a), Math.abs(d - b)); };
  const hline = (x, color, width = 2) => { const [a, b] = px(x, 0), [c] = px(x, F.FIELD_W); ctx.fillStyle = color; ctx.fillRect(Math.min(a, c), b - width / 2, Math.abs(c - a), width); };

  function draw() {
    const box = canvas.getBoundingClientRect();
    viewW = Math.max(1, box.width || 600); viewH = Math.max(1, box.height || 800);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (canvas.width !== Math.round(viewW * dpr) || canvas.height !== Math.round(viewH * dpr)) { canvas.width = Math.round(viewW * dpr); canvas.height = Math.round(viewH * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const yards = viewH / scale, c = match.carrier, b = match.ball;
    const focus = b?.air ? b : c || { x: match.los, y: match.ballY };
    const tx = (match.phase === 'live' ? focus.x : match.los) + yards * 0.2, fits = (F.FIELD_W + 5) * scale <= viewW;
    const ty = fits ? F.FIELD_W / 2 : clamp(match.phase === 'live' ? focus.y : match.ballY, viewW / scale / 2 - 2.5, F.FIELD_W - viewW / scale / 2 + 2.5);

    drawAssignment();
    drawAim();
    drawThreats();
    drawBall();
    drawFx();

    if (summary) drawSummary();
    placeThrowButtons();
  }

  function drawField() {
    const W = F.FIELD_W, offense = match.sides[match.off].team, defense = match.sides[1 - match.off].team;
    // Stands and sideline.
    rect(-12, -9, 112, W + 9, '#1b2a33'); rect(-10.6, -1.4, 110.6, W + 1.4, '#e8eee2'); rect(-10, 0, 110, W, '#2c7a48');
    for (let yard = 0; yard < 100; yard += 5) rect(yard, 0, yard + 5, W, (yard / 5) % 2 ? '#2f8050' : '#2a7446');
    rect(-10, 0, 0, W, offense.color || '#326689'); rect(100, 0, 110, W, defense.color || '#94413d');
    const [ex, ey] = px(-5, W / 2), [fx, fy] = px(105, W / 2);
    text(offense.abbr || '', ex, ey + 8, Math.max(14, scale * 2.4), '#ffffffaa'); text(defense.abbr || '', fx, fy + 8, Math.max(14, scale * 2.4), '#ffffffaa');
    for (let yard = 0; yard <= 100; yard += 5) hline(yard, yard === 0 || yard === 100 ? '#ffffff' : '#ffffff66', yard % 10 ? 1 : 1.5);
    ctx.fillStyle = '#ffffff88';
    for (let yard = 1; yard < 100; yard++) for (const hash of [23.6, 29.7, 0.7, W - 0.7]) { const [x, y] = px(yard, hash); ctx.fillRect(x - 2, y, 4, 1); }
    for (let yard = 10; yard < 100; yard += 10) for (const side of [9, W - 9]) { const [x, y] = px(yard, side); text(String(yard <= 50 ? yard : 100 - yard), x, y + scale * 0.5, Math.max(11, scale * 1.5), '#ffffff77'); }

  }

  const ROUTE_COLORS = ['#ffd166', '#7fe3ff', '#ff9d7a', '#c7f58d', '#e3b3ff'];
  function drawPlayArt() {
    if (!userOffense()) return;
    ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    for (const e of match.targets) {
      ctx.strokeStyle = ROUTE_COLORS[e.label - 1];
      ctx.beginPath(); let [x, y] = px(e.x, e.y); ctx.moveTo(x, y);
      for (const p of e.job.pts) { [x, y] = px(p.x, p.y); ctx.lineTo(x, y); }
      ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.setLineDash([]);
    if (match.play.run) {
      const holeY = match.ballY + match.play.run.hole * match.flip, [x0, y0] = px(match.los - 1.2, holeY), [x1, y1] = px(match.los + 5, holeY);
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); const d = Math.sign(y1 - y0) || -1; ctx.moveTo(x1, y1 + d * 10); ctx.lineTo(x1 - 9, y1 - d * 2); ctx.lineTo(x1 + 9, y1 - d * 2); ctx.fill();
    }
  }

  function drawPlayers() {
    const r = clamp(scale * 0.72, 7, 15), live = match.phase === 'live';
    const ordered = [...match.ents].sort((a, b) => (b.x - a.x) * viewDir());
    for (const e of ordered) {
      const [x, y] = px(e.x, e.y), mine = (e.team === 0) === userOffense(), team = (mine ? me : them).team;
      const body = team.color || (mine ? '#3c8cca' : '#c75248'), helmet = team.secondary || '#f1eadd';
      const speed = Math.hypot(e.vx, e.vy), stride = live && !paused && speed > 0.6 ? Math.sin(performance.now() / 55 + e.sy * 3) * r * 0.35 : 0;
      ctx.fillStyle = '#00000055'; ctx.beginPath(); ctx.ellipse(x, y + r * 0.75, r * 0.95, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      const controlled = live && !match.coach && (userOffense() ? e === match.carrier : e === match.userEnt);
      if (controlled || (!live && !userOffense() && e === match.userEnt)) { ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(x, y + r * 0.6, r * 1.5, r * 0.8, 0, 0, Math.PI * 2); ctx.stroke(); }
      if (e.stun > 0) { ctx.fillStyle = body; ctx.fillRect(Math.round(x - r), Math.round(y), Math.round(r * 2), Math.round(r * 0.7)); continue; }
      // Legs, jersey with shoulder pads, helmet with a stripe: chunky pixels, top-down.
      ctx.fillStyle = '#e9e6da'; ctx.fillRect(Math.round(x - r * 0.6), Math.round(y + r * 0.2), Math.round(r * 0.45), Math.round(r * 0.7 + stride)); ctx.fillRect(Math.round(x + r * 0.15), Math.round(y + r * 0.2), Math.round(r * 0.45), Math.round(r * 0.7 - stride));
      ctx.fillStyle = body; ctx.fillRect(Math.round(x - r), Math.round(y - r * 0.55), Math.round(r * 2), Math.round(r * 0.95));
      ctx.fillStyle = '#00000033'; ctx.fillRect(Math.round(x - r), Math.round(y + r * 0.15), Math.round(r * 2), Math.round(r * 0.25));
      ctx.fillStyle = helmet; ctx.fillRect(Math.round(x - r * 0.55), Math.round(y - r * 1.15), Math.round(r * 1.1), Math.round(r * 0.95));
      ctx.fillStyle = body; ctx.fillRect(Math.round(x - r * 0.12), Math.round(y - r * 1.15), Math.round(r * 0.24), Math.round(r * 0.95));
      if (e === match.carrier && !match.ball.air) { ctx.fillStyle = '#9a5a2b'; ctx.fillRect(Math.round(x + r * 0.75), Math.round(y - r * 0.2), Math.round(r * 0.55), Math.round(r * 0.8)); }

        const color = ROUTE_COLORS[e.label - 1];
        ctx.fillStyle = '#0b141c'; ctx.fillRect(Math.round(x - 8), Math.round(y - r * 1.2 - 19), 16, 15);
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.strokeRect(Math.round(x - 8), Math.round(y - r * 1.2 - 19), 16, 15);
        text(String(e.label), x, y - r * 1.2 - 7, 11, color);
        if (e.elite) text('★', x + 14, y - r * 1.2 - 7, 11, '#ffd166');

    }
  }

  function drawBall() {
    const b = match.ball;
    if (!b?.air) return;

    ctx.fillStyle = '#00000055'; ctx.beginPath(); ctx.ellipse(x, y, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b0672f'; ctx.beginPath(); ctx.ellipse(x, y - lift, 4.5, 7, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - lift - 2, 2, 4);

    ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tx, ty, 9, 0, Math.PI * 2); ctx.stroke();
  }

  /** On defense, show what your highlighted defender is responsible for. */
  function drawAssignment() {
    const u = match.userEnt;
    if (userOffense() || match.coach || !u || (match.phase !== 'presnap' && match.phase !== 'live') || match.t - match.steeredAt < 0.5 && match.phase === 'live') return;

    else if (job.type === 'rush' && match.qb) { const [qx, qy] = px(match.qb.x, match.qb.y); ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(qx, qy); ctx.stroke(); if (match.phase === 'presnap') text('RUSH THE PASSER', ux, uy + 30, 10, '#ffd166'); }

  }

  /** Flag any rusher who has come free while you still hold the ball. */
  function drawThreats() {
    if (match.phase !== 'live' || !userOffense() || match.coach || match.carrier !== match.qb || match.ball.thrown) return;
    for (const d of match.ents) {
      if (!d.team || d.eng || d.stun > 0 || d.job.type !== 'rush' || d.x > match.los + 0.5 || Math.hypot(d.x - match.qb.x, d.y - match.qb.y) > 8) continue;
      const [x, y] = px(d.x, d.y);
      ctx.fillStyle = '#ff6b5e'; ctx.fillRect(Math.round(x - 7), Math.round(y - 34), 14, 16); text('!', x, y - 21, 13, '#fff');
    }
  }

  /** First press of a number: show where the ball would go and how far it could miss. */

 for(const t of s.teams)if(!Number.isInteger(t.id)||!t.record||!t.coaches?.head||!t.coaches?.offense||!t.coaches?.defense||typeof t.scheme?.offense!=='string'||typeof t.name!=='string')fail();
 if(new Set(s.teams.map(t=>t.id)).size!==32||new Set(s.players.map(p=>p.id)).size!==s.players.length)fail();
 for(const p of [...s.players,...s.prospects])if(typeof p.id!=='string'||typeof p.name!=='string'||!p.attrs||!p.contract||!p.season||!p.career||!Number.isFinite(p.ovr)||!Number.isFinite(p.age)||!Number.isFinite(p.contract.salary)||!Array.isArray(p.transactions)||!Array.isArray(p.awards))fail();

function intro(){preview ||= E.createLeague('FOREVER',0,'pro');app.innerHTML=`<main class="intro"><header class="introheader"><div class="brand">FOURTH <em>&</em><br>FOREVER<small>PRO FOOTBALL • FRANCHISE EDITION</small></div><span class="eyebrow">EST. 2026 / BUILT FOR THE LONG GAME</span></header><section class="introhero"><div class="eyebrow" style="color:#dff077;margin-bottom:18px">32 CLUBS. ONE LEGACY.</div><h1>Your team.<br>Your era. <em>Your call.</em></h1><p>Scout the unknown. Build a contender. Take the field.<br>An entire football universe, one more week at a time.</p></section><div class="intro-play"><button class="lime" id="quick-play">▶ Quick play</button><button data-install>Install on phone</button><p>Try touch football first. No franchise setup required.</p></div><div class="slot-grid">${[0,1,2].map(i=>{const s=meta(i),t=s?.teams?.find(t=>t.id===s.userTeamId);return `<div class="slot"><div class="eyebrow">FRANCHISE ${i+1}</div><p>${s?`${esc(t?.city)} ${esc(t?.name)} · ${s.year}<br>${label(s.phase)} · Week ${s.week}`:'An unwritten legacy.<br>Create a new franchise below.'}</p>${s?`<button class="lime small" data-load="${i}">Continue franchise →</button>`:'<span class="tag">EMPTY SLOT</span>'}</div>`}).join('')}</div><div class="setupbar"><label>SAVE SLOT<select id="new-slot">${[0,1,2].map(i=>`<option value="${i}" ${!meta(i)&&i===([0,1,2].find(j=>!meta(j))??0)?'selected':''}>Franchise ${i+1}${meta(i)?' (occupied)':''}</option>`).join('')}</select></label><label>UNIVERSE SEED<input id="seed" value="FOREVER" maxlength="60"></label><label>DIFFICULTY<select id="difficulty"><option value="casual">Casual</option><option value="pro" selected>Pro</option><option value="expert">Expert</option></select></label></div><div class="split-title"><h3>Choose your franchise</h3><span class="eyebrow">THE CONTINENTAL FOOTBALL LEAGUE</span></div><div class="team-grid">${preview.teams.map(t=>`<button class="team-option ${t.id===selectedTeam?'selected':''}" data-select-team="${t.id}">${crest(t)}<strong>${esc(t.city)}</strong><small>${esc(t.name)}</small></button>`).join('')}</div><div class="intro-bottom"><p>100% free. No accounts. No purchases.<br>Your franchise stays on this device. Export a backup anytime.</p><button class="lime" id="create">Build my legacy →</button></div></main>`;$('#quick-play').onclick=quickPlay;app.querySelectorAll('[data-select-team]').forEach(b=>b.onclick=()=>{selectedTeam=Number(b.dataset.selectTeam);app.querySelectorAll('.team-option').forEach(x=>x.classList.toggle('selected',x===b))});app.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{slot=+b.dataset.load;state=validateSave(meta(slot));render()});$('#create').onclick=()=>{const i=+$('#new-slot').value;const go=()=>{slot=i;state=E.createLeague($('#seed').value||'FOREVER',selectedTeam,$('#difficulty').value);state.settings={muted:false};page='dashboard';save();render()};if(meta(i))confirmDialog('Replace this franchise?','The occupied save slot will be overwritten. Export it first if you want to keep it.',go);else go()}}
function render(){if(!state){intro();return}const t=my();app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">FOURTH <em>&</em><br>FOREVER<small>FRANCHISE FOOTBALL</small></div><div class="navlabel">YOUR FRANCHISE</div><nav class="nav">${nav.map(([id,icon,name])=>`<button data-nav="${id}" class="${page===id?'active':''}"><span class="navicon">${icon}</span>${name}</button>`).join('')}</nav><div class="sidebarfoot"><span class="live-dot"></span> LOCAL FRANCHISE ${slot+1}<br>${esc(t.stadium)}<br><span style="color:#dff077">One more week.</span></div></aside><main class="main"><header class="topbar"><div class="left"><span class="eyebrow">${esc(t.abbr)} / FRONT OFFICE</span><span class="muted">${state.year} SEASON</span></div><div class="right"><span class="muted"><span class="live-dot"></span>Autosave on</span><span class="tag">${esc(phaseName())}${state.phase==='regular'?' · W'+state.week:''}</span></div></header><div class="content">${views[page]()}</div></main><nav class="mobile-nav" aria-label="Phone navigation">${[['dashboard','◈','Home'],['roster','▤','Team'],['frontoffice','⇄','Manage'],['scouting','⌕','Draft']].map(([id,icon,name])=>`<button data-nav="${id}" class="${page===id?'active':''}"><span>${icon}</span>${name}</button>`).join('')}<button data-action="more"><span>☰</span>More</button></nav></div>`;bind()}
function heading(title,subtitle,buttons=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="muted">${subtitle}</p></div><div class="actions">${buttons}</div></div>`}
function advanceButton(){return `<button class="primary" data-action="advance">${({regular:'Simulate week',playoffs:'Advance playoff round',offseason:'Begin free agency',freeagency:'Continue to scouting',scouting:'Open the draft',draft:'Auto-pick & continue',camp:'Start new season'}[state.phase]||'Advance')} →</button>`}
function dashboard(){const t=my(),g=state.schedule.find(g=>!g.played&&g.week===state.week&&(g.home===t.id||g.away===t.id)),opp=g?team(g.home===t.id?g.away:g.home):null,cap=state.salaryCap||state.cap||255,r=players(t.id),inj=r.filter(p=>p.injury?.weeks>0||p.injury?.remaining>0);return heading('The front office',`${esc(t.city)} ${esc(t.name)} · ${phaseName()} · ${state.year}`,advanceButton())+`<div class="metrics"><div class="metric"><div class="eyebrow muted">SEASON RECORD</div><div class="value">${rec(t)}</div><div class="sub">${t.record?.pf||0} PF / ${t.record?.pa||0} PA</div></div><div class="metric"><div class="eyebrow muted">TEAM STRENGTH</div><div class="value">${Math.round(E.teamRating(state,t.id).overall)}<span class="muted" style="font-size:14px"> OVR</span></div><div class="sub">${r.length} players on roster</div></div><div class="metric"><div class="eyebrow muted">CAP SPACE</div><div class="value">${money(cap-E.capUsed(state,t.id))}</div><div class="sub">${money(cap)} league salary cap</div></div><div class="metric"><div class="eyebrow muted">SCOUTING BUDGET</div><div class="value">${state.scoutingPoints??0}</div><div class="sub">Invest in your next generation</div></div></div><div class="grid2"><div class="stack"><section class="scoreboard"><div class="meta"><span class="eyebrow">${g?'NEXT MATCHUP':'THE NEXT CHAPTER'}</span><span>${g?`WEEK ${g.week} · ${esc(team(g.home)?.stadium)}`:esc(phaseName()).toUpperCase()}</span></div>${g?`<div class="matchup"><div class="club">${crest(t)}<div class="city">${esc(t.city)}</div><div class="name">${esc(t.name)}</div><div class="city">${rec(t)}</div></div><div class="versus">${g.home===t.id?'VS':'AT'}</div><div class="club">${crest(opp)}<div class="city">${esc(opp.city)}</div><div class="name">${esc(opp.name)}</div><div class="city">${rec(opp)}</div></div></div><div class="actions"><button class="lime" data-action="play">▶ Take the field</button><button class="secondary" data-action="advance">Simulate week →</button></div>`:`<h2 style="margin:30px 0 12px">${state.phase==='draft'?'Your future is on the clock.':state.phase==='regular'?'A week to recover.':'Build the next contender.'}</h2><p style="font-size:13px;color:#b6ccb8;margin-bottom:28px">${state.phase==='regular'?'Your team has a bye. Train, manage the roster, then advance the week.':'Manage contracts, evaluate talent, and prepare for the next chapter of your franchise.'}</p><div class="actions"><button class="lime" data-nav="${state.phase==='scouting'||state.phase==='draft'?'scouting':'frontoffice'}">${state.phase==='draft'?'Enter draft room':'Manage franchise'} →</button></div>`}</section><section class="panel"><div class="panelhead"><h3>The locker room</h3><button class="small" data-nav="roster">Full roster ↗</button></div><div class="tablewrap">${playerTable([...r].sort((a,b)=>b.ovr-a.ovr).slice(0,5),false)}</div></section><section class="panel"><div class="panelhead"><h3>Weekly preparation</h3><span class="tag">${inj.length} INJURED</span></div><div class="panelbody"><div class="form-grid"><label>Training emphasis<select id="training"><option value="balanced">Balanced development</option><option value="physical">Conditioning & recovery</option><option value="technical">Technical fundamentals</option><option value="young">Develop young players</option></select></label><label>Offensive identity<select id="scheme">${['West Coast','Spread','Vertical','Power Run','Zone Run','Play Action'].map(x=>`<option ${t.scheme?.offense===x?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="hint">Coaching, playing time, health and training shape development. Your depth chart determines who gets the opportunities.</p>${inj.map(p=>`<div class="hint">${pname(p)} <span class="tag red">${esc(p.injury.type)} · ${p.injury.weeks??p.injury.remaining} weeks</span></div>`).join('')}</div></section></div><div class="stack"><section class="panel"><div class="panelhead"><h3>Around the league</h3><span class="eyebrow muted">THE WIRE</span></div>${state.news.slice(0,8).map(n=>`<div class="news-item"><small>${n.year||state.year} / WEEK ${n.week??state.week}</small>${esc(n.text||n)}</div>`).join('')||'<div class="empty">A new era begins.</div>'}</section><section class="panel"><div class="panelhead"><h3>Division watch</h3><button class="small" data-nav="standings">All standings ↗</button></div>${standingTable(state.teams.filter(x=>x.conference===t.conference&&x.division===t.division))}</section></div></div>`}
function playerTable(list,full=true,mode='roster'){return `<table><thead><tr><th>Player</th><th>Pos</th><th>Age</th><th>OVR</th>${full?'<th>Archetype</th><th>Development</th>':''}<th>${mode==='fa'?'Asking / yr':'Cap hit'}</th>${full?'<th>Status</th><th></th>':''}</tr></thead><tbody>${list.map(p=>`<tr><td>${pname(p)}${p.starter?' <span class="tag">1ST</span>':''}</td><td>${p.pos}</td><td>${p.age}</td><td>${rating(p.ovr)}</td>${full?`<td class="muted">${esc(p.archetype)}</td><td>${esc(p.estimate||'Uncertain')}</td>`:''}<td class="mono">${money(mode==='fa'?E.marketValue(p):((p.contract?.salary||0)+(p.contract?.bonus||0)))}</td>${full?`<td>${p.injury?.weeks>0?`<span class="tag red">${p.injury.weeks}W INJURY</span>`:`<span class="tag green">HEALTHY</span>`}</td><td><button class="small" ${mode==='fa'?`data-sign="${p.id}"`:`data-start="${p.id}"`}>${mode==='fa'?'Make offer':'Start'}</button></td>`:''}</tr>`).join('')}</tbody></table>`}
function rosterView(){const list=players(state.userTeamId).filter(p=>(!filter||p.pos===filter)&&p.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>sort==='pos'?POS.indexOf(a.pos)-POS.indexOf(b.pos)||b.ovr-a.ovr:b[sort]-a[sort]);return heading('Roster & depth chart',`${players(state.userTeamId).length} players · Click a player to inspect their story, attributes and contract.`)+`<div class="toolbar"><input id="search" placeholder="Find a player…" value="${esc(search)}"><select id="position"><option value="">All positions</option>${POS.map(p=>`<option ${p===filter?'selected':''}>${p}</option>`).join('')}</select><select id="sort"><option value="ovr" ${sort==='ovr'?'selected':''}>Overall rating</option><option value="pos" ${sort==='pos'?'selected':''}>Position</option><option value="age" ${sort==='age'?'selected':''}>Age</option></select></div><div class="panel tablewrap">${playerTable(list)}</div><p class="hint">Start promotes a player to the top of their position group. Healthy backups replace injured starters automatically.</p>`}
function standingTable(ts){return `<div class="tablewrap"><table><thead><tr><th>Club</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th></tr></thead><tbody>${[...ts].sort((a,b)=>(b.record.w+.5*b.record.t)-(a.record.w+.5*a.record.t)||(b.record.pf-b.record.pa)-(a.record.pf-a.record.pa)).map(t=>`<tr class="${t.id===state.userTeamId?'mine':''}"><td><strong>${esc(t.city)}</strong> <span class="muted">${esc(t.name)}</span></td><td>${t.record.w}</td><td>${t.record.l}</td><td>${t.record.t||0}</td><td>${t.record.pf}</td><td>${t.record.pa}</td></tr>`).join('')}</tbody></table></div>`}
function standingsView(){return heading('The league table','32 clubs. Eight divisions. One champion.')+[0,1].map(c=>`<h2 class="section-gap" style="margin-bottom:15px">${c===0?'Frontier':'Atlantic'} Conference</h2><div class="grid-equal">${[0,1,2,3].map(d=>`<section class="panel"><div class="panelhead"><h3>${['North','South','East','West'][d]} Division</h3></div>${standingTable(state.teams.filter(t=>t.conference===c&&t.division===d))}</section>`).join('')}</div>`).join('')}
function scheduleView(){const games=state.schedule.filter(g=>filter==='all'||g.home===state.userTeamId||g.away===state.userTeamId);return heading('Season schedule','Every Sunday is another chance to build your legacy.',advanceButton())+`<div class="toolbar"><select id="schedule-filter"><option value="">My franchise</option><option value="all" ${filter==='all'?'selected':''}>Entire league</option></select><button data-action="sim-event">Sim to next event →</button></div><div class="panel tablewrap"><table><thead><tr><th>Week</th><th>Away</th><th>Home</th><th>Result</th><th></th></tr></thead><tbody>${games.map(g=>`<tr class="${g.week===state.week?'mine':''}"><td>${g.week}</td><td>${esc(team(g.away)?.city)} <strong>${esc(team(g.away)?.name)}</strong></td><td>${esc(team(g.home)?.city)} <strong>${esc(team(g.home)?.name)}</strong></td><td class="mono">${g.played?`${g.awayScore} – ${g.homeScore}`:'—'}</td><td>${g.played?`<button class="small" data-box="${g.id}">Box score</button>`:'<span class="tag">UPCOMING</span>'}</td></tr>`).join('')}</tbody></table></div>`}
const statsKeys=['passYards','passTD','rushYards','rushTD','recYards','recTD','tackles','sacks','interceptions'];
function stat(p,k,scope='season'){const st=p[scope]||{};const aliases={passYards:['passingYards'],passTD:['passingTDs','passTds','passTDs'],rushYards:['rushingYards'],rushTD:['rushingTDs','rushTDs'],recYards:['receivingYards'],recTD:['receivingTDs','recTDs'],interceptions:['defInt','defInts','ints']};return st[k]??aliases[k]?.map(a=>st[a]).find(v=>v!==undefined)??0}
function statsView(){const scope=filter==='career'?'career':'season';return heading('Numbers tell the story',`${state.year} league leaders · Active players`)+`<div class="toolbar"><select id="stats-scope"><option value="season">Current season</option><option value="career" ${scope==='career'?'selected':''}>Career</option></select></div><div class="leaders">${statsKeys.map(k=>`<section class="panel"><div class="panelhead"><h3>${label(k)}</h3></div><table><tbody>${[...state.players].sort((a,b)=>stat(b,k,scope)-stat(a,k,scope)).slice(0,5).map((p,i)=>`<tr><td class="muted">${i+1}</td><td>${pname(p)}<div class="muted" style="font-size:10px;margin-top:3px">${team(p.teamId)?.abbr||'FA'} · ${p.pos}</div></td><td class="mono"><strong>${num(stat(p,k,scope))}</strong></td></tr>`).join('')}</tbody></table></section>`).join('')}</div>`}
function frontoffice(){const cap=state.salaryCap||state.cap||255,fa=state.players.filter(p=>p.teamId===null&&!p.retired&&(!filter||p.pos===filter)).sort((a,b)=>b.ovr-a.ovr).slice(0,65),t=my();return heading('Build something lasting','Contracts, the open market, and the next move.',`<button data-action="trade">⇄ Propose trade</button>`)+`<div class="metrics"><div class="metric"><div class="eyebrow muted">COMMITTED</div><div class="value">${money(E.capUsed(state,t.id))}</div></div><div class="metric"><div class="eyebrow muted">AVAILABLE</div><div class="value">${money(cap-E.capUsed(state,t.id))}</div></div><div class="metric"><div class="eyebrow muted">ROSTER</div><div class="value">${players(t.id).length}<span class="muted" style="font-size:14px"> / 53</span></div></div><div class="metric"><div class="eyebrow muted">DRAFT ASSETS</div><div class="value">${availablePicks().filter(p=>p.teamId===t.id).length}</div></div></div>${(state.tradeOffers||[]).length?`<section class="panel" style="margin-bottom:20px"><div class="panelhead"><h3>Incoming trade offers</h3></div>${state.tradeOffers.map(o=>`<div class="news-item"><p>${esc(o.description)}</p><button class="small" data-accept-trade="${o.id}">Review offer</button></div>`).join('')}</section>`:''}<section class="panel"><div class="panelhead"><h3>Your coaching staff</h3><span class="tag">SCHEME: ${esc(t.scheme?.offense)}</span></div><div class="panelbody"><div class="grid-equal">${Object.entries(t.coaches||{}).map(([role,c])=>`<div><div class="eyebrow muted">${label(role)}</div><h3 style="margin:8px 0">${esc(c.name||role)}</h3><p class="hint">${Object.entries(c).filter(([k,v])=>typeof v==='number').map(([k,v])=>`${label(k)} ${v}`).join(' · ')}</p><button class="small" data-coach="${role}">Hire replacement</button></div>`).join('')}</div></div></section><div class="split-title section-gap"><h2>Free-agent market</h2><select id="position"><option value="">All positions</option>${POS.map(p=>`<option ${p===filter?'selected':''}>${p}</option>`).join('')}</select></div><div class="panel tablewrap">${playerTable(fa,true,'fa')}</div><p class="hint">Offers compete with CPU clubs. Players consider money, opportunity and team quality. Release players from their player card to make room.</p><section class="panel section-gap"><div class="panelhead"><h3>Draft capital</h3></div><div class="panelbody actions">${availablePicks().filter(p=>p.teamId===t.id).map(p=>`<span class="tag">${p.year} · R${p.round} · ${esc(team(p.originalTeamId)?.abbr||'')}</span>`).join('')||'No picks owned.'}</div></section>`}
function scouting(){const d=state.draft,cur=d?.order?.[d.index],owner=typeof cur==='object'?cur.teamId:state.picks.find(p=>p.id===cur)?.teamId;const list=state.prospects.filter(p=>!p.drafted&&(!filter||p.pos===filter)&&p.name.toLowerCase().includes(search.toLowerCase()));return heading('Find the next great one',`${state.year} draft class · ${state.prospects.length} prospects · ${state.scoutingPoints} scouting points`,advanceButton())+`${state.phase==='draft'?`<div class="draft-banner"><div><div class="eyebrow">THE DRAFT / PICK ${(d?.index||0)+1} OF ${d?.order?.length||224}</div><h2>${esc(team(owner)?.city||'Draft room')} ${esc(team(owner)?.name||'')}</h2></div><div class="actions"><button class="lime" data-action="next-pick">Advance to my pick →</button><button data-action="trade">Trade assets</button></div></div>`:`<div class="panel panelbody" style="margin-bottom:20px"><h3>Information is an advantage. Certainty is a myth.</h3><p class="hint">Scout to narrow a player's grade. Private workouts reveal more but cost extra. Potential is an estimate, and projected first-rounders can still disappoint.</p></div>`}<div class="panel panelbody" style="margin-bottom:18px"><div class="eyebrow muted">YOUR BIGGEST NEEDS · ${esc(state.draftClass||'Upcoming class')}</div><div class="actions" style="margin-top:10px">${E.needs(state).slice(0,6).map(n=>`<span class="tag">${n.pos} · ${n.rating} OVR · ${n.count}/${n.target}</span>`).join('')}</div>${d?.selections?.length?`<p class="hint">Latest selection: #${d.selections.at(-1).pick} · ${esc(team(d.selections.at(-1).teamId)?.abbr)} selects ${esc(d.selections.at(-1).name)} (${d.selections.at(-1).pos})</p>`:''}</div><div class="toolbar"><input id="search" value="${esc(search)}" placeholder="Search the big board…"><select id="position"><option value="">All positions</option>${POS.map(p=>`<option ${p===filter?'selected':''}>${p}</option>`).join('')}</select></div><div class="panel tablewrap"><table><thead><tr><th>Rank</th><th>Prospect</th><th>Pos</th><th>Age</th><th>Projection</th><th>Development</th><th>College</th><th>Evaluation</th><th></th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${p.rank||i+1}</td><td>${pname(p)}</td><td>${p.pos}</td><td>${p.age}</td><td>${esc(p.scoutGrade?`${Math.round(p.scoutGrade)} grade · R${p.projectedRound}`:p.projectedRound?`Round ${p.projectedRound}`:p.projected||p.grade||'Unscouted')}</td><td>${esc(p.estimate||'Uncertain')}</td><td class="muted">${esc(p.college)}</td><td><button class="small" data-scout="${p.id}">Scout · 15</button> <button class="small" data-workout="${p.id}">Workout · 25</button> <button class="small" data-interview="${p.id}">Interview · 10</button></td><td>${state.phase==='draft'?`<button class="primary small" data-draft="${p.id}">Draft</button>`:''}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">The next class will arrive during the offseason.</div>':''}</div>`}
function historyView(){return heading('The story of the league','Champions, legends, and the seasons that made them.')+`<div class="panel"><div class="panelhead"><h3>Championship archive</h3><span class="tag">${state.history.length} SEASONS</span></div>${state.history.length?`<div class="tablewrap"><table><thead><tr><th>Season</th><th>Champion</th><th>Finalist</th><th>MVP</th></tr></thead><tbody>${[...state.history].reverse().map(h=>`<tr><td>${h.year}</td><td><strong>${esc(team(h.championId??h.champion)?.city||h.championName||'')} ${esc(team(h.championId??h.champion)?.name||'')}</strong></td><td>${esc(team(h.runnerUpId??h.runnerUp)?.name||'—')}</td><td>${esc(h.mvp?.name||state.players.find(p=>p.id===(h.mvpId??h.mvp))?.name||h.mvpName||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">The record books are open. The first chapter is yours to write.</div>'}</div><div class="grid-equal section-gap"><section class="panel"><div class="panelhead"><h3>Single-season records</h3></div>${Object.entries(state.records||{}).map(([k,r])=>`<div class="news-item"><small>${label(k)} · ${r.year}</small><strong>${esc(r.name)}</strong> · ${num(r.value)}</div>`).join('')||'<div class="empty">Records established after the first season.</div>'}</section><section class="panel"><div class="panelhead"><h3>Hall of Fame</h3></div>${(state.hallOfFame||[]).slice(-15).reverse().map(p=>`<div class="news-item"><small>CLASS OF ${p.year} · ${p.pos}</small>${esc(p.name)}</div>`).join('')||'<div class="empty">Great careers become lasting legends.</div>'}</section></div>${state.history.at(-1)?.awards?.length?`<section class="panel section-gap"><div class="panelhead"><h3>${state.history.at(-1).year} Honors</h3></div>${state.history.at(-1).awards.map(a=>`<div class="news-item"><small>${esc(a.title)}</small>${esc(a.name)} · ${esc(team(a.teamId)?.abbr)}</div>`).join('')}</section>`:''}<section class="panel section-gap"><div class="panelhead"><h3>League chronicle</h3></div>${state.news.slice(0,70).map(n=>`<div class="news-item"><small>${n.year} / WEEK ${n.week}</small>${esc(n.text||n)}</div>`).join('')}</section>`}
function settings(){return heading('Your franchise, preserved','Local saves are stored in this browser. Export backups to keep them safe.')+`<section class="panel"><div class="setting-row"><div><h3>Play from your home screen</h3><p>Open this game in Safari or Chrome on your phone, then add it to your home screen.</p></div><button data-install>Install</button></div><div class="setting-row"><div><h3>Sound on the field</h3><p>Original synthesized game sounds.</p></div><button data-action="mute">${state.settings?.muted?'Unmute':'Mute'}</button></div><div class="setting-row"><div><h3>Export franchise</h3><p>Download the complete league, history, contracts and current progress.</p></div><button data-action="export">Export JSON ↓</button></div><div class="setting-row"><div><h3>Import franchise</h3><p>Restore a backup into the current save slot.</p></div><input id="import" type="file" accept=".json,application/json" aria-label="Import franchise"></div><div class="setting-row"><div><h3>Save and return to title</h3><p>Choose another franchise or start a fresh universe.</p></div><button data-action="title">Save & exit</button></div></section><section class="panel section-gap"><div class="panelhead"><h3>Taking the field</h3></div><div class="panelbody"><p>Drag the left thumb stick to move. Select a play, then tap SNAP. Tap a receiver target to throw; control transfers after the catch. Hold SPRINT to accelerate and use the skill button to evade a tackle. On desktop, use WASD/arrows, Space and 1–4. Escape pauses.</p><p class="hint">Defense is simulated. Position ratings, line play, coverage, coaching and fatigue affect every matchup. Complete a game to commit its result to the franchise.</p></div></section>`}
const views={dashboard,roster:rosterView,schedule:scheduleView,standings:standingsView,stats:statsView,frontoffice,scouting,history:historyView,settings};
function dialog(title,body){modal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="dialoghead"><h2>${esc(title)}</h2><button id="close-modal" class="small" aria-label="Close dialog">✕</button></header><div class="dialogbody">${body}</div></section></div>`;$('#close-modal').onclick=()=>modal.innerHTML='';modal.querySelector('.overlay').onclick=e=>{if(e.target===e.currentTarget)modal.innerHTML=''};$('#close-modal').focus();modal.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>playerCard(b.dataset.player))}
function confirmDialog(title,body,fn){dialog(title,`<p>${esc(body)}</p><div class="actions section-gap"><button class="primary" id="confirm">Confirm</button><button id="cancel">Cancel</button></div>`);$('#confirm').onclick=()=>{modal.innerHTML='';fn()};$('#cancel').onclick=()=>modal.innerHTML=''}
function playerCard(id){const p=[...state.players,...state.prospects].find(p=>String(p.id)===String(id));if(!p)return;const prospect=state.prospects.includes(p),own=p.teamId===state.userTeamId;dialog(p.name,`<div class="player-identity"><div class="pixel-portrait" style="--skin:${["#b8754b","#daac83","#75452e","#d49364"][p.appearance%4||0]};--jersey:${team(p.teamId)?.color||"#4b6650"}"><i></i><b>${p.pos}</b></div><div><div class="eyebrow muted">${esc(p.college)}</div><h3>${esc(p.archetype)}</h3><p class="hint">${esc((p.traits||[]).join(" · "))}</p></div></div><div class="details"><div><small>Position / age</small>${p.pos} · ${p.age} years</div><div><small>Club</small>${esc(team(p.teamId)?.name|| (prospect?'Draft prospect':'Free agent'))}</div><div><small>Archetype</small>${esc(p.archetype)}</div><div><small>College</small>${esc(p.college)}</div><div><small>Development estimate</small>${esc(p.estimate||'Uncertain')}</div><div><small>Personality</small>${esc(p.personality||p.trait||'Team-first')}</div><div><small>Measurements</small>${esc(p.height||'—')} · ${esc(p.weight||'—')} lb</div><div><small>Draft</small>${p.draftYear||'—'} · Round ${p.draftRound||'—'} · Pick ${p.draftPick||p.draftSelection||'—'}</div><div><small>Health</small>${p.injury?.weeks>0?`${esc(p.injury.type)} · ${p.injury.weeks} weeks`:'Available'}</div></div>${prospect?`<div class="panel panelbody"><h3>Scouting report</h3><p class="hint">${esc(typeof p.report==='string'?p.report:label(p.report?.summary||''))}</p><div class="details"><div><small>Projected round</small>${p.projectedRound}</div><div><small>Scouted grade</small>${Math.round(p.scoutGrade||0)}</div><div><small>Evaluations</small>${p.scouted||0} / 3</div></div><p class="hint">Strengths: ${esc(Array.isArray(p.strengths)?p.strengths.join(', '):p.strengths)}<br>Weaknesses: ${esc(Array.isArray(p.weaknesses)?p.weaknesses.join(', '):p.weaknesses)}</p><div class="details">${Object.entries(p.combine||{}).map(([k,v])=>`<div><small>${label(k)}</small>${esc(v)}</div>`).join('')}</div></div>`:`<div class="metrics"><div class="metric"><div class="eyebrow muted">Overall</div><div class="value">${p.ovr}</div></div><div class="metric"><div class="eyebrow muted">Annual salary</div><div class="value">${money(p.contract?.salary)}</div></div><div class="metric"><div class="eyebrow muted">Years left</div><div class="value">${p.contract?.years||0}</div></div><div class="metric"><div class="eyebrow muted">Morale</div><div class="value">${Math.round(p.morale||70)}</div></div></div><h3 style="margin-bottom:18px">The skill set</h3><div class="attrs">${relevantAttrs(p).map(([k,v])=>`<div class="attr"><span>${label(k)}</span><strong>${Math.round(v)}</strong><div class="progress"><span style="width:${Math.min(100,v)}%"></span></div></div>`).join('')}</div><h3 class="section-gap" style="margin-bottom:12px">Production</h3><div class="tablewrap"><table><thead><tr><th></th>${statsKeys.map(k=>`<th>${label(k)}</th>`).join('')}</tr></thead><tbody>${['season','career'].map(s=>`<tr><td>${label(s)}</td>${statsKeys.map(k=>`<td>${num(stat(p,k,s))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}<h3 class="section-gap">Career journal</h3><p class="hint">${(p.transactions||p.history||[]).map(x=>esc(typeof x==='string'?x:JSON.stringify(x))).join('<br>')||'A new chapter is waiting to be written.'}</p>${p.awards?.length?`<p class="hint">Awards: ${p.awards.map(x=>esc(typeof x==='string'?x:JSON.stringify(x))).join(' · ')}</p>`:''}${own?`<div class="actions section-gap"><button class="primary" id="card-extend">Extend contract</button><button id="card-start">Promote to starter</button><button class="danger" id="card-release">Release player</button></div>`:!prospect&&p.teamId===null?'<button class="primary" id="card-sign">Make contract offer</button>':''}`);if(own){$('#card-extend').onclick=()=>offer(id,true);$('#card-start').onclick=()=>{action(()=>E.setStarter(state,p.id));playerCard(id)};$('#card-release').onclick=()=>confirmDialog(`Release ${p.name}?`,'Guaranteed money can remain on your salary cap. This player will enter free agency.',()=>action(()=>E.releasePlayer(state,p.id)))}if($('#card-sign'))$('#card-sign').onclick=()=>offer(id,false)}
function offer(id,extension=false){const p=state.players.find(p=>String(p.id)===String(id));dialog(`${extension?'Extend':'Sign'} ${p.name}`,`<p class="hint">Available cap: ${money((state.salaryCap||state.cap||255)-E.capUsed(state,state.userTeamId))}. A competitive offer improves your chance of agreement.</p><div class="form-grid"><label>Contract years<select id="offer-years">${[1,2,3,4,5].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></label><label>Annual salary ($ millions)<input id="offer-salary" type="number" min="0.8" max="80" step="0.1" value="${(E.marketValue(p)).toFixed(1)}"></label></div><button class="primary section-gap" id="submit-offer">Submit offer</button>`);$('#submit-offer').onclick=()=>{const years=+$('#offer-years').value,salary=+$('#offer-salary').value;if(!Number.isFinite(salary)||salary<.8||salary>80){toast('Offer between $0.8M and $80M per year.');return}modal.innerHTML='';action(()=>extension?E.extendPlayer(state,p.id,years,salary):E.signPlayer(state,p.id,years,salary))}}
function tradeDialog(other=state.teams.find(t=>t.id!==state.userTeamId).id){const assets=id=>`<div class="check-list">${players(id).sort((a,b)=>b.ovr-a.ovr).map(p=>`<label><input type="checkbox" data-asset="player" value="${p.id}">${esc(p.name)} · ${p.pos} · ${p.ovr} · ${money(p.contract?.salary)}</label>`).join('')}${availablePicks().filter(p=>p.teamId===id).map(p=>`<label><input type="checkbox" data-asset="pick" value="${p.id}">${p.year} round ${p.round} · ${esc(team(p.originalTeamId)?.abbr)}</label>`).join('')}</div>`;dialog('Work the phones',`<p class="hint">Each club evaluates talent, age, salary, needs and draft capital. Both rosters must remain affordable. Trades are final when accepted.</p><label>Trading partner <select id="trade-team">${state.teams.filter(t=>t.id!==state.userTeamId).map(t=>`<option value="${t.id}" ${t.id===other?'selected':''}>${esc(t.city)} ${esc(t.name)}</option>`).join('')}</select></label><div class="form-grid section-gap"><div id="give-assets"><h3>You offer</h3>${assets(state.userTeamId)}</div><div id="get-assets"><h3>You receive</h3>${assets(other)}</div></div><button id="submit-trade" class="primary section-gap">Propose trade</button>`);$('#trade-team').onchange=e=>tradeDialog(+e.target.value);$('#submit-trade').onclick=()=>{const ids=(s,k)=>[...modal.querySelectorAll(`${s} input[data-asset="${k}"]:checked`)].map(x=>{const all=k==='player'?state.players:state.picks;return all.find(p=>String(p.id)===x.value).id});const gp=ids('#give-assets','player'),rp=ids('#get-assets','player'),gk=ids('#give-assets','pick'),rk=ids('#get-assets','pick');action(()=>E.trade(state,other,gp,rp,gk,rk));tradeDialog(other)}}
function box(id){const g=state.schedule.find(g=>String(g.id)===String(id));const sides=[g.box?.away,g.box?.home].filter(Boolean);dialog(`${team(g.away).abbr} ${g.awayScore} — ${g.homeScore} ${team(g.home).abbr}`,`<p class="eyebrow muted">WEEK ${g.week} · ${esc(team(g.home).stadium)}</p><div class="grid-equal section-gap">${sides.map(b=>`<section class="panel"><div class="panelhead"><h3>${esc(team(b.teamId).name)}</h3><strong>${b.points} PTS</strong></div><div class="panelbody"><div class="details"><div><small>Total yards</small>${b.yards}</div><div><small>Passing</small>${b.passYards}</div><div><small>Rushing</small>${b.rushYards}</div></div><p class="hint">${b.turnovers} turnovers${b.played?' · Your played offensive totals':''}</p></div></section>`).join('')}</div>${sides.map(b=>`<h3 class="section-gap">${esc(team(b.teamId).abbr)} · Player production</h3><div class="tablewrap"><table><thead><tr><th>Player</th><th>Pos</th><th>Pass YD</th><th>TD</th><th>Rush YD</th><th>Rec YD</th><th>Tackles</th><th>Sacks</th></tr></thead><tbody>${b.lines.map(l=>`<tr><td><button class="playerlink" data-player="${l.playerId}">${esc(l.name)}</button></td><td>${l.pos}</td><td>${l.passYards||'—'}</td><td>${(l.passTD||0)+(l.rushTD||0)+(l.recTD||0)||'—'}</td><td>${l.rushYards||'—'}</td><td>${l.recYards||'—'}</td><td>${l.tackles||'—'}</td><td>${l.sacks||'—'}</td></tr>`).join('')}</tbody></table></div>`).join('')}`)}

function quickPlay(){const universe=preview||E.createLeague('TOUCH-FOOTBALL',selectedTeam,'casual');const home=universe.teams.find(t=>t.id===selectedTeam),away=universe.teams.find(t=>t.id===(selectedTeam+1)%32);const host=document.createElement('div');host.className='gamehost';document.body.append(host);document.body.classList.add('playing');const cleanup=()=>{live?.destroy();live=null;host.remove();document.body.classList.remove('playing')};try{live=startGame(host,{home,away,userTeamId:home.id,homeRoster:E.roster(universe,home.id),awayRoster:E.roster(universe,away.id),difficulty:'casual',muted:false,onFinish:r=>{cleanup();dialog('Final whistle',`<h2>${esc(home.abbr)} ${r.homeScore} — ${r.awayScore} ${esc(away.abbr)}</h2><p class="hint">Exhibition complete. Build a franchise to develop this team across seasons.</p><button class="primary" id="play-again">Play again</button>`);$('#play-again').onclick=()=>{modal.innerHTML='';quickPlay()}},onExit:cleanup});}catch(e){cleanup();toast(e.message);console.error(e)}}
function play(){const g=state.schedule.find(g=>!g.played&&g.week===state.week&&(g.home===state.userTeamId||g.away===state.userTeamId));if(!g){toast('No game scheduled. Advance to your next event.');return}const host=document.createElement('div');host.className='gamehost';document.body.append(host);document.body.classList.add('playing');try{live=startGame(host,{home:team(g.home),away:team(g.away),userTeamId:state.userTeamId,homeRoster:players(g.home),awayRoster:players(g.away),difficulty:state.difficulty,muted:state.settings?.muted,settings:state.settings,onSettings:s=>{state.settings={...state.settings,...s};save();},onFinish:result=>{live?.destroy();live=null;host.remove();document.body.classList.remove('playing');action(()=>E.recordPlayedGame(state,g.id,result));toast('Final whistle. Game result saved.');},onExit:()=>{live?.destroy();live=null;host.remove();document.body.classList.remove('playing');render()}})}catch(e){host.remove();document.body.classList.remove('playing');toast(e.message);console.error(e)}}
function bind(){app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;filter='';search='';render();window.scrollTo(0,0)});app.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>playerCard(b.dataset.player));app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>action(()=>E.setStarter(state,state.players.find(p=>String(p.id)===b.dataset.start).id)));app.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>offer(b.dataset.sign));app.querySelectorAll('[data-scout],[data-workout],[data-interview]').forEach(b=>b.onclick=()=>{const id=b.dataset.scout||b.dataset.workout||b.dataset.interview,p=state.prospects.find(p=>String(p.id)===id);action(()=>E.scout(state,p.id,b.dataset.workout?'workout':b.dataset.interview?'interview':'report'))});app.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>action(()=>E.draftPlayer(state,state.prospects.find(p=>String(p.id)===b.dataset.draft).id)));app.querySelectorAll('[data-coach]').forEach(b=>b.onclick=()=>action(()=>E.hireCoach(state,b.dataset.coach)));app.querySelectorAll('[data-accept-trade]').forEach(b=>b.onclick=()=>{const o=state.tradeOffers.find(x=>String(x.id)===b.dataset.acceptTrade);confirmDialog('Accept trade offer?',o.description,()=>action(()=>E.acceptTradeOffer(state,o.id)))});app.querySelectorAll('[data-box]').forEach(b=>b.onclick=()=>box(b.dataset.box));app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='more'){dialog('Your franchise',`<div class="mobile-menu">${nav.map(([id,icon,name])=>`<button data-menu-nav="${id}">${icon} ${name}</button>`).join('')}</div>`);modal.querySelectorAll('[data-menu-nav]').forEach(x=>x.onclick=()=>{page=x.dataset.menuNav;filter='';search='';modal.innerHTML='';render();window.scrollTo(0,0)})}if(a==='advance')action(()=>E.advance(state));if(a==='next-pick')action(()=>E.simToUserPick(state));if(a==='play')play();if(a==='trade')tradeDialog();if(a==='mute')action(()=>{state.settings||={};state.settings.muted=!state.settings.muted;return 'Audio preference saved.'});if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=`fourth-forever-${my().abbr}-${state.year}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='title'){save();state=null;intro()}if(a==='sim-event'){action(()=>{const phase=state.phase;if(phase==='regular'){let guard=0;while(state.phase==='regular'&&guard++<20)E.advance(state)}else E.advance(state);return 'Simulation complete. Your next decision awaits.'})}});if($('#position'))$('#position').onchange=e=>{filter=e.target.value;render()};if($('#sort'))$('#sort').onchange=e=>{sort=e.target.value;render()};if($('#search'))$('#search').oninput=e=>{const caret=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(caret,caret)};if($('#schedule-filter'))$('#schedule-filter').onchange=e=>{filter=e.target.value;render()};if($('#stats-scope'))$('#stats-scope').onchange=e=>{filter=e.target.value;render()};if($('#scheme'))$('#scheme').onchange=e=>action(()=>{my().scheme.offense=e.target.value;return 'Offensive scheme updated.'});if($('#training')){$('#training').value=my().training||'balanced';$('#training').onchange=e=>action(()=>{my().training=e.target.value;return 'Training emphasis saved.'})}if($('#import'))$('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>100000000)throw Error('Backup exceeds 100 MB.');const s=JSON.parse(await file.text());validateSave(s);confirmDialog('Restore this backup?','This replaces the current save slot.',()=>{state=s;save();render();toast('Franchise restored.')})}catch(err){toast(err.message)}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!live)modal.innerHTML=''});
window.addEventListener('beforeunload',()=>save());
app.innerHTML='<div class="empty">Opening the franchise vault…</div>';
openSaves().then(intro).catch(e=>{intro();toast("Browser storage unavailable. You can play and export a backup.");console.error(e)});
</script></body></html>
